name: CI

# Continuous integration for viavitae-qa.
#
# Pipeline: setup -> lint -> typecheck -> unit tests -> SAST -> dependency scan.
# This repo is purely Node.js/TypeScript; no Python legs run.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # lint — ESLint + Prettier + markdownlint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm exec eslint .

      - name: Prettier
        run: pnpm exec prettier --check .

      - name: Markdownlint
        run: pnpm exec markdownlint '**/*.md' --ignore node_modules

  # ---------------------------------------------------------------------------
  # typecheck — tsc --noEmit (strict)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript strict check
        run: pnpm exec tsc --noEmit

  # ---------------------------------------------------------------------------
  # unit — node:test for fixture validators, budget schema, URL lists
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fixture validation + PII heuristics
        run: pnpm test:fixtures

      - name: Budget schema consistency
        run: pnpm test:budgets

      - name: URL list validation
        run: pnpm test:unit

      - name: Verify all specs are matched by at least one project
        run: |
          set -euo pipefail
          pnpm exec playwright test --list --reporter=line 2>&1 | tee tests.listed || true
          # Count unique spec files on disk vs unique spec files Playwright lists.
          # Specs matched by multiple projects appear multiple times in --list output,
          # so we must compare unique counts on both sides.
          expected=$(find e2e/specs -name '*.spec.ts' | wc -l | tr -d ' ')
          listed=$(grep -oE '[^ ]+\.spec\.ts' tests.listed | sort -u | wc -l | tr -d ' ')
          echo "Specs on disk: ${expected}; unique specs listed by Playwright: ${listed}"
          if [ "${listed}" -ne "${expected}" ]; then
            echo "::error::Playwright lists ${listed} unique spec files but ${expected} exist on disk. A testMatch regex may have orphaned specs (F10 class)."
            exit 1
          fi
          # Specifically verify demo specs are not silently skipped
          if ! grep -q "demo-reset\|demo-templates" tests.listed; then
            echo "::error::Demo specs (demos/) not matched by any project. Check testMatch regexes."
            exit 1
          fi
          echo "All spec files accounted — no silent skips."

  # ---------------------------------------------------------------------------
  # sast — Semgrep TypeScript ruleset (container invocation)
  #
  # The legacy returntocorp/semgrep-action@v1 is deprecated (unmaintained rules
  # drift + supply-chain risk). The maintained approach is the official
  # semgrep/semgrep Docker image with `semgrep ci` CLI invocation.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Semgrep scan
        run: semgrep ci --config p/typescript --config p/security-audit --metrics=off

  # ---------------------------------------------------------------------------
  # dependency-scan — Trivy filesystem (fail on CRITICAL)
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL"
          exit-code: "1"
